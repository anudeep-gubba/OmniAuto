name: CI

# Phase 13 (requirement.md section 26): command-line-driven, the same shape as
# requirement.md's own `mvn clean test -Denv=qa -Dgroups=regression -Dbrowser=chrome
# -Dheadless=true` example - nothing here is CI-specific framework behavior, it's the same
# flags any engineer already runs locally (see README.md's "CI/CD" section).
#
# Note: "regression" in that example is illustrative, not a group this repo's tests are
# actually tagged with (verified live, not assumed - see README.md's "found in practice"
# note under CI/CD). The full run below leaves -Dgroups empty (every group) rather than
# filtering to a group name that would silently match zero tests and report a false-green
# build.
#
# Mobile is excluded (no emulator/Appium on a hosted runner), and so is `frameworkSelfTest`
# (RetryBehaviorTest's deliberately-always-failing method - see its own Javadoc for why that
# group exists).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      groups:
        description: "TestNG groups to run (-Dgroups=...); leave blank to run every group"
        required: false
        default: ""
      browser:
        description: "Browser (-Dbrowser=...)"
        required: false
        default: "chrome"
      env:
        description: "Environment (-Denv=...)"
        required: false
        default: "qa"

env:
  # Resolved by SecretManager as CI/CD environment variables - highest precedence over
  # .secret.env, which does not exist in CI at all (it is gitignored, never committed).
  # Configure these as repository secrets: Settings > Secrets and variables > Actions.
  EVENTHUB_EMAIL: ${{ secrets.EVENTHUB_EMAIL }}
  EVENTHUB_PASSWORD: ${{ secrets.EVENTHUB_PASSWORD }}

jobs:
  smoke:
    name: Smoke (every PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # ubuntu-latest images ship Chrome and Firefox preinstalled; Selenium Manager
      # (bundled with Selenium 4) resolves the matching chromedriver/geckodriver at
      # runtime - no separate driver-install step needed.
      - name: Run smoke tests
        run: >
          mvn -B clean test
          -Denv=qa -Dgroups=smoke -Dbrowser=chrome -Dheadless=true
          -DexcludedGroups=mobile,frameworkSelfTest

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: |
            target/surefire-reports/
            logs/
            reports/extent/
            allure-results/
            target/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  regression:
    name: Full regression (push to main / manual)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run regression suite
        # -Dgroups is intentionally omitted when the dispatch input is blank (the default) -
        # an empty value runs every group, confirmed live; a nonexistent group name like the
        # requirement doc's illustrative "regression" would instead silently run zero tests
        # and still report success.
        run: >
          mvn -B clean test
          -Denv=${{ github.event.inputs.env || 'qa' }}
          -Dgroups=${{ github.event.inputs.groups }}
          -Dbrowser=${{ github.event.inputs.browser || 'chrome' }}
          -Dheadless=true
          -DexcludedGroups=mobile,frameworkSelfTest

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports
          path: |
            target/surefire-reports/
            logs/
            reports/extent/
            allure-results/
            target/screenshots/
          if-no-files-found: ignore
          retention-days: 30

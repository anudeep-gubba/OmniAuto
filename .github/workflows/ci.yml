name: CI

# Phase 13 (requirement.md section 26): command-line-driven, the same shape as
# requirement.md's own `mvn clean test -Denv=qa -Dgroups=regression -Dbrowser=chrome
# -Dheadless=true` example - nothing here is CI-specific framework behavior, it's the same
# flags any engineer already runs locally (see README.md's "CI/CD" section).
#
# Note: "regression" in that example is illustrative, not a group this repo's tests are
# actually tagged with (verified live, not assumed - see README.md's "found in practice"
# note under CI/CD). The full run below leaves -Dgroups empty (every group) rather than
# filtering to a group name that would silently match zero tests and report a false-green
# build.
#
# Mobile is excluded (no emulator/Appium on a hosted runner), and so is `frameworkSelfTest`
# (RetryBehaviorTest's deliberately-always-failing method - see its own Javadoc for why that
# group exists).
#
# Audit finding fix: this used to run exactly one browser per job (a fixed 'chrome' default,
# or whatever single value a manual dispatch passed) despite the framework supporting four -
# cross-browser support was never actually exercised in CI. `smoke` (every PR) and the
# automatic push-to-main `regression` job below now both run a real matrix over every browser
# ubuntu-latest guarantees preinstalled (chrome, firefox - see README's Setup section; edge/
# safari are not guaranteed present on this runner image, so are left to local/self-hosted
# runs). `fail-fast: false` so one browser's failure doesn't cancel the other mid-run - two
# independent signals, not one merged into whichever fails first. A manual `workflow_dispatch`
# still runs its own single job at whatever browser input is given (default chrome), unchanged,
# since a manual run is normally someone deliberately targeting one browser.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      groups:
        description: "TestNG groups to run (-Dgroups=...); leave blank to run every group"
        required: false
        default: ""
      browser:
        description: "Browser (-Dbrowser=...)"
        required: false
        default: "chrome"
      env:
        description: "Environment (-Denv=...)"
        required: false
        default: "qa"

env:
  # Resolved by SecretManager as CI/CD environment variables - highest precedence over
  # .secret.env, which does not exist in CI at all (it is gitignored, never committed).
  # Configure these as repository secrets: Settings > Secrets and variables > Actions.
  EVENTHUB_EMAIL: ${{ secrets.EVENTHUB_EMAIL }}
  EVENTHUB_PASSWORD: ${{ secrets.EVENTHUB_PASSWORD }}

jobs:
  smoke:
    name: Smoke (every PR, ${{ matrix.browser }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # ubuntu-latest images ship Chrome and Firefox preinstalled; Selenium Manager
      # (bundled with Selenium 4) resolves the matching chromedriver/geckodriver at
      # runtime - no separate driver-install step needed.
      - name: Run smoke tests
        run: >
          mvn -B clean test
          -Denv=qa -Dgroups=smoke -Dbrowser=${{ matrix.browser }} -Dheadless=true
          -DexcludedGroups=mobile,frameworkSelfTest

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports-${{ matrix.browser }}
          path: |
            target/surefire-reports/
            logs/
            reports/extent/
            allure-results/
            target/screenshots/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  regression:
    name: Full regression (push to main, ${{ matrix.browser }})
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run regression suite
        # -Dgroups is intentionally left blank - a push-to-main run is always "every group",
        # never filtered; a nonexistent group name like the requirement doc's illustrative
        # "regression" would instead silently run zero tests and still report success.
        run: >
          mvn -B clean test
          -Denv=qa -Dgroups= -Dbrowser=${{ matrix.browser }} -Dheadless=true
          -DexcludedGroups=mobile,frameworkSelfTest

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports-${{ matrix.browser }}
          path: |
            target/surefire-reports/
            logs/
            reports/extent/
            allure-results/
            target/screenshots/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 30

  regression-manual:
    name: Full regression (manual dispatch, single browser)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run regression suite
        # A manual dispatch honors whatever single browser/env/groups the person running it
        # chose (defaults: qa/chrome/every group) - deliberately not the push job's [chrome,
        # firefox] matrix, since a manual trigger is normally someone targeting one specific
        # combination on purpose, not asking for the full cross-browser sweep.
        run: >
          mvn -B clean test
          -Denv=${{ github.event.inputs.env || 'qa' }}
          -Dgroups=${{ github.event.inputs.groups }}
          -Dbrowser=${{ github.event.inputs.browser || 'chrome' }}
          -Dheadless=true
          -DexcludedGroups=mobile,frameworkSelfTest

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-manual-reports
          path: |
            target/surefire-reports/
            logs/
            reports/extent/
            allure-results/
            target/screenshots/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 30

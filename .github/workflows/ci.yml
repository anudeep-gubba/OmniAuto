name: CI

# Phase 13 (requirement.md section 26): command-line-driven, the same shape as
# requirement.md's own `mvn clean test -Denv=qa -Dcucumber.filter.tags="@regression"
# -Dbrowser=chrome -Dheadless=true` example - nothing here is CI-specific framework behavior,
# it's the same flags any engineer already runs locally (see README.md's "CI/CD" section).
#
# Every scenario is Cucumber/Gherkin now (see README.md's "BDD / Cucumber" notes); scenario
# selection is entirely -Dcucumber.filter.tags (a Cucumber tag expression), read automatically
# by cucumber-testng - the old -Dgroups/-DexcludedGroups TestNG flags no longer select anything
# scenario-scoped, since every scenario physically runs through one shared TestNG method
# (see com.framework.listeners.CucumberScenarioSupport's javadoc).
#
# Note: "@regression" in that example is illustrative, not a tag this repo's scenarios are
# actually tagged with (verified live, not assumed - see README.md's "found in practice" note
# under CI/CD). The full run below leaves -Dcucumber.filter.tags as just "not @mobile" (every
# tag) rather than filtering to a tag nothing carries, which would silently match zero
# scenarios and report a false-green build.
#
# Mobile is excluded (no emulator/Appium on a hosted runner) via "not @mobile" in every tag
# expression below.
#
# Audit finding fix: this used to run exactly one browser per job (a fixed 'chrome' default,
# or whatever single value a manual dispatch passed) despite the framework supporting four -
# cross-browser support was never actually exercised in CI. `smoke` (every PR) and the
# automatic push-to-main `regression` job below now both run a real matrix over every browser
# ubuntu-latest guarantees preinstalled (chrome, firefox - see README's Setup section; edge/
# safari are not guaranteed present on this runner image, so are left to local/self-hosted
# runs). `fail-fast: false` so one browser's failure doesn't cancel the other mid-run - two
# independent signals, not one merged into whichever fails first. A manual `workflow_dispatch`
# still runs its own single job at whatever browser input is given (default chrome), unchanged,
# since a manual run is normally someone deliberately targeting one browser.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tags:
        description: "Cucumber tag expression to run (-Dcucumber.filter.tags=...), e.g. \"@smoke and @api\"; leave blank to run every tag"
        required: false
        default: ""
      browser:
        description: "Browser (-Dbrowser=...)"
        required: false
        default: "chrome"
      env:
        description: "Environment (-Denv=...)"
        required: false
        default: "qa"

env:
  # Resolved by SecretManager as CI/CD environment variables - highest precedence over
  # .secret.env, which does not exist in CI at all (it is gitignored, never committed).
  # Configure these as repository secrets: Settings > Secrets and variables > Actions.
  EVENTHUB_EMAIL: ${{ secrets.EVENTHUB_EMAIL }}
  EVENTHUB_PASSWORD: ${{ secrets.EVENTHUB_PASSWORD }}

jobs:
  smoke:
    name: Smoke (every PR, ${{ matrix.browser }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # ubuntu-latest images ship Chrome and Firefox preinstalled; Selenium Manager
      # (bundled with Selenium 4) resolves the matching chromedriver/geckodriver at
      # runtime - no separate driver-install step needed.
      - name: Run smoke tests
        run: >
          mvn -B clean test
          -Denv=qa -Dcucumber.filter.tags="@smoke and not @mobile" -Dbrowser=${{ matrix.browser }} -Dheadless=true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports-${{ matrix.browser }}
          path: |
            target/surefire-reports/
            logs/
            reports/extent/
            reports/api/
            allure-results/
            target/screenshots/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  regression:
    name: Full regression (push to main, ${{ matrix.browser }})
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run regression suite
        # -Dcucumber.filter.tags is intentionally just "not @mobile" - a push-to-main run is
        # always "every tag" (mobile aside), never filtered further; a nonexistent tag like the
        # requirement doc's illustrative "@regression" would instead silently match zero
        # scenarios and still report success.
        run: >
          mvn -B clean test
          -Denv=qa -Dcucumber.filter.tags="not @mobile" -Dbrowser=${{ matrix.browser }} -Dheadless=true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports-${{ matrix.browser }}
          path: |
            target/surefire-reports/
            logs/
            reports/extent/
            reports/api/
            allure-results/
            target/screenshots/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 30

  regression-manual:
    name: Full regression (manual dispatch, single browser)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run regression suite
        # A manual dispatch honors whatever single browser/env/tags the person running it chose
        # (defaults: qa/chrome/every tag) - deliberately not the push job's [chrome, firefox]
        # matrix, since a manual trigger is normally someone targeting one specific combination
        # on purpose, not asking for the full cross-browser sweep. Mobile is always excluded
        # (no emulator/Appium on this runner) by ANDing "not @mobile" onto whatever tag
        # expression was given, rather than letting a manual run accidentally include it.
        run: >
          mvn -B clean test
          -Denv=${{ github.event.inputs.env || 'qa' }}
          -Dcucumber.filter.tags="${{ github.event.inputs.tags != '' && format('({0}) and not @mobile', github.event.inputs.tags) || 'not @mobile' }}"
          -Dbrowser=${{ github.event.inputs.browser || 'chrome' }}
          -Dheadless=true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-manual-reports
          path: |
            target/surefire-reports/
            logs/
            reports/extent/
            reports/api/
            allure-results/
            target/screenshots/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 30

# QA environment configuration (default when -Denv is omitted). Every config/{env}.properties
# file is self-contained; override any single key with -Dkey=value.

browser=chrome
headless=false
resolution=maximize
# resolution: maximize | <width>x<height>

page.load.timeout=30
script.timeout=30
implicit.wait.timeout=0
explicit.wait.timeout=15
polling.interval=500
# Driver timeouts above are in seconds.

screenshot.mode=FAILURE
# screenshot.mode: FAILURE | EVERY_ACTION | DISABLED

api.connection.timeout=10000
api.socket.timeout=10000
# API timeouts above are in milliseconds.

retry.max.count=1

testdata.format=json
# testdata.format: json | yaml | csv | excel

mobile.device.provider=LOCAL
# mobile.device.provider: LOCAL | BROWSERSTACK
appium.command.timeout=60
appium.server.url=http://127.0.0.1:4723/wd/hub

# mobile.platform picks androidList/iosList in config/mobile-devices.json for a sequential
# run, or the combined pool for a -Dparallel run - see README "Mobile".
mobile.platform=android

# App binary per platform - device definitions themselves live in config/mobile-devices.json.
mobile.app.path.android=apps/eventhub-app-release.apk
mobile.app.path.ios=apps/eventhub-app-simulator.app

base.url=https://eventhub.rahulshettyacademy.com
api.base.url=https://api.eventhub.rahulshettyacademy.com/api

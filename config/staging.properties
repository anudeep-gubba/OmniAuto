# STAGING environment configuration - fully self-contained (no separate default.properties;
# each environment file carries its own complete settings). Not the default environment
# (qa.properties is) - select explicitly with -Denv=staging.

browser=chrome
headless=false
# "maximize" (every test gets the full available screen) or "<width>x<height>"
# for a fixed viewport, e.g. to test a specific breakpoint (1920x1080,
# 1366x768, 375x812, ...). See requirement.md section 25.
resolution=maximize

# Driver timeouts, in seconds (requirement.md section 24).
page.load.timeout=30
script.timeout=30
# 0 = disabled. Selenium best practice: rely on explicit waits (Phase 5), not
# implicit wait - mixing the two causes unpredictable effective wait times.
implicit.wait.timeout=0
explicit.wait.timeout=15
polling.interval=500

# Screenshot capture mode: FAILURE | EVERY_ACTION | DISABLED (requirement.md section 19).
screenshot.mode=FAILURE

# API timeouts, in milliseconds (requirement.md section 24).
api.connection.timeout=10000
api.socket.timeout=10000

# Retry (requirement.md section 23): a controlled, bounded retry - not blanket auto-retry
# masking real flakiness. RetryAnalyzer never retries an assertion failure (a genuine
# business/logic failure, not transient infrastructure noise) regardless of this count.
retry.max.count=1

# Mobile (requirement.md section 8/34) - available in every environment, not just one; the
# same local emulator/simulator is used regardless of -Denv, since this project's
# environments all target the same sandbox anyway (adopting this framework for a real
# project with genuinely separate per-environment device farms is exactly what
# mobile.device.provider=BROWSERSTACK + -D overrides below are for). Adjust
# mobile.device.name/mobile.platform.version to match your own local AVD/simulator if they
# differ, or override per-run via -D without editing this file at all.
#
# mobile.device.provider=LOCAL (the default - can be left unset) covers both this
# emulator/simulator setup as-is AND a real physical device plugged into this machine (same
# local Appium server; set mobile.udid to the device's serial/UDID instead of/as well as
# mobile.device.name - see README.md "Mobile device providers"). Override to a cloud device
# farm for this same test suite with zero code changes, regardless of which
# config/{env}.properties is active:
#   mvn test -Dgroups=mobile -Dmobile.device.provider=BROWSERSTACK \
#       -Dmobile.device.name="Samsung Galaxy S23" -Dmobile.platform.version=13 \
#       -Dbrowserstack.app.id=bs://<app-id-from-browserstack-upload>
# (BROWSERSTACK_USERNAME/BROWSERSTACK_ACCESS_KEY are secrets - see .secret.env.example.)
mobile.device.provider=LOCAL
appium.command.timeout=60
appium.server.url=http://127.0.0.1:4723/wd/hub

# Android (active by default) - local Pixel_10 AVD via the Android SDK's own emulator
# (apps/swaglabs.apk - the public Sauce Labs SwagLabs demo app).
mobile.platform=android
mobile.device.name=Pixel_10
mobile.platform.version=17
mobile.app.path=apps/swaglabs.apk

# iOS alternative - override mobile.platform/device.name/platform.version/app.path (e.g. via
# -D, or by commenting the Android block above and uncommenting this one) to run the exact
# same suite against a local iOS simulator instead: apps/swag.app, the same SwagLabs app's
# iOS build (bundle ID com.saucelabs.SwagLabsMobileApp). Live-verified against a real
# "iPhone 17 Pro" / iOS 26.2 simulator - adjust both to match whatever simulator you actually
# have booted (`xcrun simctl list devices available`). The same test-* accessibility
# identifiers already work unmodified on both platforms (Phase 6), so every mobile Page
# Object supports this with no code change at all:
#   mvn test -Dgroups=mobile -Dmobile.platform=ios -Dmobile.device.name="iPhone 17 Pro" \
#       -Dmobile.platform.version=26.2 -Dmobile.app.path=apps/swag.app
# mobile.platform=ios
# mobile.device.name=iPhone 17 Pro
# mobile.platform.version=26.2
# mobile.app.path=apps/swag.app

# base.url / api.base.url both point at eventhub.rahulshettyacademy.com - a public
# QA-practice sandbox app with its own live REST API (api.eventhub.rahulshettyacademy.com),
# the designated Web+API validation target for this framework. Point these at your
# application's actual STAGING URLs when this framework is adopted for a real project.
base.url=https://eventhub.rahulshettyacademy.com
api.base.url=https://api.eventhub.rahulshettyacademy.com/api

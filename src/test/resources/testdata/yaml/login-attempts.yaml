# Array-root shape (unlike login.json's object-root) - each element is one record,
# named via its own "name" field rather than a JSON/YAML object key. Drives a
# TestNG @DataProvider-based login test (requirement.md section 9/38).
- name: validCredentials
  email: "${{EVENTHUB_EMAIL}}"
  password: "${{EVENTHUB_PASSWORD}}"
  expectSuccess: true
- name: wrongPassword
  email: "${{EVENTHUB_EMAIL}}"
  password: "DefinitelyWrongPassword1!"
  expectSuccess: false
